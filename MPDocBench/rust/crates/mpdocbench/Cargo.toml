[package]
name = "mpdocbench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpdocbench-score"
path = "src/main.rs"

[dependencies]
pylatexenc = { path = "../pylatexenc" }
pysoup = { path = "../pysoup" }
teds = { path = "../teds" }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
regex = "1"
fancy-regex = "0.14"
rayon = "1"
unicode-general-category = "1"
